<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiLivraison - Calavi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;background:#FFF7ED;margin:0;padding:15px}
.card{background:white;padding:20px;border-radius:15px;margin-bottom:15px}
input,select{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-size:18px;font-weight:bold}
.btn-orange{background:#ff6b00;color:white}
.btn-pi{background:#7c3aed;color:white;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>Commander une livraison</h2>
<input placeholder="D'où ? Ex: Godomey">
<input placeholder="Vers où ? Ex: Calavi centre">
<select><option>Moto - 500 FCFA</option><option>Voiture - 1500 FCFA</option></select>
<input placeholder="Ton numéro WhatsApp">
<button class="btn btn-orange">COMMANDER MAINTENANT</button>
<button id="btnPi" class="btn btn-pi">PAYER EN Pi (TEST)</button>
<p id="msgPi" style="text-align:center"></p>
</div>
<div class="card">
<h3>🍔 Restaurants partenaires</h3>
<p>🍕 Maquis Chez Manon - Godomey</p>
<p>🍕 Pizza Calavi - Arconville</p>
<p>🍗 Poulet Bicyclette - Ouèdo</p>
</div>
<script>
Pi.init({version:"2.0", sandbox:true});
document.getElementById("btnPi").onclick = function(){
document.getElementById("msgPi").innerText="Connexion Pi...";
Pi.authenticate(['payments'], function(auth){
Pi.createPayment({amount:0.01, memo:"Livraison test", metadata:{test:1}}, {
onReadyForServerApproval:function(id){ document.getElementById("msgPi").innerText="Paiement créé : "+id; },
onReadyForServerCompletion:function(id,tx){ document.getElementById("msgPi").innerText="Paiement réussi !"; },
onCancel:function(id){ document.getElementById("msgPi").innerText="Annulé"; },
onError:function(e){ document.getElementById("msgPi").innerText="Erreur : "+e; }
});
}, function(e){ document.getElementById("msgPi").innerText="Erreur auth : "+e; });
};
</script>
</body>
</html>
